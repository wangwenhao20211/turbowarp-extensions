<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="bgGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a3a30"/>
      <stop offset="50%" stop-color="#153027"/>
      <stop offset="100%" stop-color="#0f2418"/>
    </linearGradient>

    <linearGradient id="bGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5ee6bd"/>
      <stop offset="100%" stop-color="#0fbd8c"/>
    </linearGradient>

    <pattern id="dots2" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="rgba(94,230,189,0.15)"/>
    </pattern>

    <filter id="glowFilter2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- ===== 玻璃面板相关 ===== -->
    <!-- 玻璃主体填充：上亮下暗再回亮，模拟厚度 -->
    <linearGradient id="glassFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.14"/>
    </linearGradient>

    <!-- 玻璃边框描边：对角线渐变，制造"边缘反光" -->
    <linearGradient id="glassStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.55"/>
    </linearGradient>

    <!-- 玻璃顶部内高光 -->
    <linearGradient id="glassHighlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- 背后光斑模糊 -->
    <filter id="blobBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>

    <!-- 玻璃投影 -->
    <filter id="glassShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="800" height="400" fill="url(#bgGrad2)"/>
  <rect width="800" height="400" fill="url(#dots2)"/>

  <!-- 装饰圆 -->
  <circle cx="80" cy="60" r="100" fill="#0fbd8c" opacity="0.08"/>
  <circle cx="720" cy="340" r="120" fill="#5ee6bd" opacity="0.08"/>
  <circle cx="700" cy="80" r="50" fill="#64b5f6" opacity="0.06"/>
  <circle cx="400" cy="200" r="160" fill="#0fbd8c" opacity="0.05"/>

  <!-- 玻璃背后的彩色光斑（模糊，透过玻璃看到的效果） -->
  <g filter="url(#blobBlur)">
    <circle cx="340" cy="150" r="55" fill="#5ee6bd" opacity="0.55"/>
    <circle cx="470" cy="260" r="55" fill="#4c97ff" opacity="0.45"/>
    <circle cx="430" cy="130" r="45" fill="#9d4eff" opacity="0.35"/>
    <circle cx="330" cy="290" r="40" fill="#ff4c9d" opacity="0.25"/>
  </g>

  <!-- 玻璃面板 -->
  <g filter="url(#glassShadow)">
    <!-- 主体 -->
    <rect x="270" y="70" width="260" height="260" rx="44"
          fill="url(#glassFill)"
          stroke="url(#glassStroke)" stroke-width="1.5"/>
    <!-- 顶部高光条 -->
    <rect x="282" y="82" width="236" height="80" rx="36"
          fill="url(#glassHighlight)"/>
    <!-- 内侧细白线（增强精致感） -->
    <rect x="274" y="74" width="252" height="252" rx="41"
          fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1"/>
  </g>

  <!-- 花括号 -->
  <g transform="translate(400 200)" fill="none" stroke="url(#bGrad)" stroke-width="16"
     stroke-linecap="round" stroke-linejoin="round" filter="url(#glowFilter2)">
    <path d="M -50 -60 Q -50 -30 -80 -30 L -95 -30 Q -110 -30 -110 0 Q -110 30 -95 30 L -80 30 Q -50 30 -50 60"/>
    <path d="M 50 -60 Q 50 -30 80 -30 L 95 -30 Q 110 -30 110 0 Q 110 30 95 30 L 80 30 Q 50 30 50 60"/>
  </g>

  <!-- 中央小光点 -->
  <circle cx="400" cy="200" r="8" fill="#5ee6bd" filter="url(#glowFilter2)" opacity="0.7"/>

  <!-- 底部装饰点阵 -->
  <g transform="translate(400 355)" fill="#0fbd8c" opacity="0.4">
    <circle cx="-30" cy="0" r="3"/>
    <circle cx="-15" cy="0" r="3"/>
    <circle cx="0" cy="0" r="3"/>
    <circle cx="15" cy="0" r="3"/>
    <circle cx="30" cy="0" r="3"/>
  </g>

  <!-- 四角装饰 -->
  <path d="M 30 30 L 60 30 M 30 30 L 30 60" stroke="#0fbd8c" stroke-width="2" stroke-opacity="0.35" fill="none" stroke-linecap="round"/>
  <path d="M 770 30 L 740 30 M 770 30 L 770 60" stroke="#0fbd8c" stroke-width="2" stroke-opacity="0.35" fill="none" stroke-linecap="round"/>
  <path d="M 30 370 L 60 370 M 30 370 L 30 340" stroke="#0fbd8c" stroke-width="2" stroke-opacity="0.35" fill="none" stroke-linecap="round"/>
  <path d="M 770 370 L 740 370 M 770 370 L 770 340" stroke="#0fbd8c" stroke-width="2" stroke-opacity="0.35" fill="none" stroke-linecap="round"/>
</svg>
