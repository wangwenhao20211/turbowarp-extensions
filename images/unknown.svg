    <rect x="6" y="4" width="146.75" height="71.375" rx="14"
          fill="url(#glassFill)"
          stroke="#ffffff" stroke-opacity="0.45" stroke-width="0.5"/>
    <rect x="8" y="6" width="142.75" height="22" rx="11"
          fill="url(#glassHighlight)"/>
    <rect x="6.5" y="4.5" width="145.75" height="70.375" rx="13.5"
          fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="0.3"/>
  </g>

