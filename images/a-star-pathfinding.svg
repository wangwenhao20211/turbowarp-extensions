<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1e3f"/>
      <stop offset="50%" stop-color="#2a1e4f"/>
      <stop offset="100%" stop-color="#0f1626"/>
    </linearGradient>

    <pattern id="grid" width="52" height="52" patternUnits="userSpaceOnUse" x="140" y="44">
      <path d="M 52 0 L 0 0 0 52" fill="none" stroke="rgba(140,170,255,0.18)" stroke-width="1"/>
    </pattern>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="800" height="400" fill="url(#bgGrad)"/>

  <!-- 装饰光晕 -->
  <circle cx="90" cy="80" r="140" fill="#4c97ff" opacity="0.08"/>
  <circle cx="720" cy="340" r="160" fill="#9d4eff" opacity="0.08"/>
  <circle cx="700" cy="60" r="60" fill="#00d4ff" opacity="0.06"/>

  <!-- 网格面板 -->
  <rect x="140" y="44" width="520" height="312" fill="rgba(255,255,255,0.025)" rx="14"
        stroke="rgba(140,170,255,0.25)" stroke-width="1"/>
  <rect x="140" y="44" width="520" height="312" fill="url(#grid)" rx="14"/>

  <!-- 已探索节点（淡青半透明方块） -->
  <g fill="rgba(0,212,255,0.18)">
    <rect x="142" y="306" width="48" height="48" rx="6"/>
    <rect x="194" y="306" width="48" height="48" rx="6"/>
    <rect x="246" y="306" width="48" height="48" rx="6"/>
    <rect x="246" y="254" width="48" height="48" rx="6"/>
    <rect x="246" y="202" width="48" height="48" rx="6"/>
    <rect x="246" y="150" width="48" height="48" rx="6"/>
    <rect x="246" y="98"  width="48" height="48" rx="6"/>
    <rect x="246" y="46"  width="48" height="48" rx="6"/>
    <rect x="298" y="98"  width="48" height="48" rx="6"/>
    <rect x="350" y="98"  width="48" height="48" rx="6"/>
    <rect x="402" y="98"  width="48" height="48" rx="6"/>
    <rect x="402" y="46"  width="48" height="48" rx="6"/>
    <rect x="454" y="46"  width="48" height="48" rx="6"/>
    <rect x="506" y="46"  width="48" height="48" rx="6"/>
    <rect x="558" y="46"  width="48" height="48" rx="6"/>
    <rect x="610" y="46"  width="48" height="48" rx="6"/>
    <!-- 扩散的探索节点 -->
    <rect x="194" y="254" width="48" height="48" rx="6" opacity="0.7"/>
    <rect x="194" y="202" width="48" height="48" rx="6" opacity="0.6"/>
    <rect x="142" y="254" width="48" height="48" rx="6" opacity="0.6"/>
    <rect x="298" y="46"  width="48" height="48" rx="6" opacity="0.7"/>
    <rect x="350" y="46"  width="48" height="48" rx="6" opacity="0.7"/>
    <rect x="454" y="98"  width="48" height="48" rx="6" opacity="0.6"/>
    <rect x="558" y="98"  width="48" height="48" rx="6" opacity="0.6"/>
    <rect x="142" y="202" width="48" height="48" rx="6" opacity="0.4"/>
    <rect x="194" y="150" width="48" height="48" rx="6" opacity="0.35"/>
    <rect x="298" y="150" width="48" height="48" rx="6" opacity="0.3"/>
  </g>

  <!-- 障碍物 -->
  <g fill="#3a4560" filter="url(#softShadow)">
    <rect x="352" y="204" width="44" height="44" rx="6"/>
    <rect x="352" y="256" width="44" height="44" rx="6"/>
    <rect x="352" y="308" width="44" height="44" rx="6"/>
    <rect x="404" y="152" width="44" height="44" rx="6"/>
    <rect x="404" y="204" width="44" height="44" rx="6"/>
    <rect x="508" y="100" width="44" height="44" rx="6"/>
    <rect x="508" y="152" width="44" height="44" rx="6"/>
  </g>

  <!-- 路径光晕 -->
  <polyline points="166,330 218,330 270,330 270,278 270,226 270,174 270,122 322,122 374,122 426,122 426,70 478,70 530,70 582,70 634,70"
            fill="none" stroke="#fbbf24" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"
            opacity="0.25"/>

  <!-- 路径主线 -->
  <polyline points="166,330 218,330 270,330 270,278 270,226 270,174 270,122 322,122 374,122 426,122 426,70 478,70 530,70 582,70 634,70"
            fill="none" stroke="#fbbf24" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"
            filter="url(#glow)"/>

  <!-- 路径节点小圆点 -->
  <g fill="#fbbf24">
    <circle cx="218" cy="330" r="3"/>
    <circle cx="270" cy="278" r="3"/>
    <circle cx="270" cy="226" r="3"/>
    <circle cx="270" cy="174" r="3"/>
    <circle cx="322" cy="122" r="3"/>
    <circle cx="374" cy="122" r="3"/>
    <circle cx="426" cy="70" r="3"/>
    <circle cx="478" cy="70" r="3"/>
    <circle cx="530" cy="70" r="3"/>
    <circle cx="582" cy="70" r="3"/>
  </g>

  <!-- 起点 -->
  <g>
    <circle cx="166" cy="330" r="30" fill="#10b981" opacity="0.25"/>
    <circle cx="166" cy="330" r="22" fill="#10b981" filter="url(#glow)"/>
    <circle cx="166" cy="330" r="9" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- 终点 -->
  <g>
    <circle cx="634" cy="70" r="30" fill="#ef4444" opacity="0.25"/>
    <circle cx="634" cy="70" r="22" fill="#ef4444" filter="url(#glow)"/>
    <path d="M 634 58 L 634 82 M 622 70 L 646 70"
          stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- 起终点标记环 -->
  <circle cx="166" cy="330" r="28" fill="none" stroke="#10b981" stroke-width="2" opacity="0.5" stroke-dasharray="4 6"/>
  <circle cx="634" cy="70"  r="28" fill="none" stroke="#ef4444" stroke-width="2" opacity="0.5" stroke-dasharray="4 6"/>

  <!-- 左上角装饰：算法特征标注（用图形代替文字） -->
  <g transform="translate(28 36)" opacity="0.85">
    <circle cx="8" cy="8" r="8" fill="#10b981"/>
    <rect x="26" y="2" width="52" height="12" rx="6" fill="rgba(255,255,255,0.25)"/>
  </g>
  <g transform="translate(28 66)" opacity="0.85">
    <circle cx="8" cy="8" r="8" fill="#ef4444"/>
    <rect x="26" y="2" width="42" height="12" rx="6" fill="rgba(255,255,255,0.25)"/>
  </g>
  <g transform="translate(28 96)" opacity="0.85">
    <rect x="0" y="0" width="16" height="16" rx="3" fill="#3a4560"/>
    <rect x="26" y="2" width="56" height="12" rx="6" fill="rgba(255,255,255,0.25)"/>
  </g>
  <g transform="translate(28 126)" opacity="0.85">
    <rect x="0" y="0" width="16" height="16" rx="3" fill="#fbbf24"/>
    <rect x="26" y="2" width="48" height="12" rx="6" fill="rgba(255,255,255,0.25)"/>
  </g>

  <!-- 右下角装饰：节点计数（点阵） -->
  <g transform="translate(700 340)" fill="#8caaff" opacity="0.35">
    <circle cx="0" cy="0" r="2.5"/>
    <circle cx="12" cy="0" r="2.5"/>
    <circle cx="24" cy="0" r="2.5"/>
    <circle cx="36" cy="0" r="2.5"/>
    <circle cx="0" cy="12" r="2.5"/>
    <circle cx="12" cy="12" r="2.5"/>
    <circle cx="24" cy="12" r="2.5"/>
    <circle cx="36" cy="12" r="2.5"/>
    <circle cx="0" cy="24" r="2.5"/>
    <circle cx="12" cy="24" r="2.5"/>
    <circle cx="24" cy="24" r="2.5"/>
    <circle cx="36" cy="24" r="2.5"/>
  </g>
</svg>
