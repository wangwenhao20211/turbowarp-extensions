<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="100%" stop-color="#c0392b"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5fa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="800" height="400" fill="url(#bg)"/>

  <!-- 装饰圆 -->
  <circle cx="100" cy="60" r="90" fill="#ffffff" opacity="0.08"/>
  <circle cx="720" cy="360" r="120" fill="#ffffff" opacity="0.06"/>
  <circle cx="700" cy="50" r="40" fill="#ffffff" opacity="0.1"/>
  <circle cx="80" cy="340" r="30" fill="#ffffff" opacity="0.1"/>
  <circle cx="400" cy="200" r="160" fill="#ffffff" opacity="0.04"/>

  <!-- 左侧：源造型（含 {{key}} 标记） -->
  <g transform="translate(190 200) rotate(-6)" filter="url(#shadow)">
    <rect x="-110" y="-130" width="220" height="260" rx="24"
          fill="url(#panel)" stroke="#ffffff" stroke-width="3"/>

    <g transform="translate(-5 -70)">
      <!-- 左大括号 {{ -->
      <path d="M -50 -30 Q -65 -30 -65 -15 L -65 -5 Q -65 0 -75 0 Q -65 0 -65 5 L -65 15 Q -65 30 -50 30"
            fill="none" stroke="#cc3c3c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M -30 -30 Q -45 -30 -45 -15 L -45 -5 Q -45 0 -55 0 Q -45 0 -45 5 L -45 15 Q -45 30 -30 30"
            fill="none" stroke="#cc3c3c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- key 占位块 -->
      <rect x="-20" y="-9" width="40" height="18" rx="4" fill="#cc3c3c" opacity="0.7"/>
      <!-- 右大括号 }} -->
      <path d="M 50 -30 Q 65 -30 65 -15 L 65 -5 Q 65 0 75 0 Q 65 0 65 5 L 65 15 Q 65 30 50 30"
            fill="none" stroke="#cc3c3c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 30 -30 Q 45 -30 45 -15 L 45 -5 Q 45 0 55 0 Q 45 0 45 5 L 45 15 Q 45 30 30 30"
            fill="none" stroke="#cc3c3c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- 其他示意文字 -->
    <rect x="-80" y="5" width="140" height="12" rx="6" fill="#888" opacity="0.5"/>
    <rect x="-80" y="40" width="120" height="12" rx="6" fill="#888" opacity="0.5"/>
    <rect x="-80" y="75" width="100" height="12" rx="6" fill="#888" opacity="0.4"/>
    <rect x="-80" y="110" width="80" height="12" rx="6" fill="#888" opacity="0.3"/>
  </g>

  <!-- 右侧：目标造型（已翻译，第一行变绿） -->
  <g transform="translate(610 200) rotate(6)" filter="url(#shadow)">
    <rect x="-110" y="-130" width="220" height="260" rx="24"
          fill="url(#panel)" stroke="#ffffff" stroke-width="3"/>

    <rect x="-80" y="-82" width="160" height="24" rx="6" fill="#2ecc71" opacity="0.9"/>

    <rect x="-80" y="5" width="150" height="12" rx="6" fill="#888" opacity="0.5"/>
    <rect x="-80" y="40" width="130" height="12" rx="6" fill="#888" opacity="0.5"/>
    <rect x="-80" y="75" width="100" height="12" rx="6" fill="#888" opacity="0.4"/>
    <rect x="-80" y="110" width="90" height="12" rx="6" fill="#888" opacity="0.3"/>
  </g>

  <!-- 中央：双向箭头（代表翻译/替换） -->
  <g transform="translate(400 200)">
    <circle r="62" fill="#ffffff" opacity="0.98" filter="url(#shadow)"/>
    <g fill="none" stroke="#ff4c4c" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
      <!-- 上箭头 → -->
      <path d="M -30 -16 L 24 -16"/>
      <path d="M 14 -28 L 28 -16 L 14 -4"/>
      <!-- 下箭头 ← -->
      <path d="M 30 16 L -24 16"/>
      <path d="M -14 4 L -28 16 L -14 28"/>
    </g>
  </g>
</svg>
